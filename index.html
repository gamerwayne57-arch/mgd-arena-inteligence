<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MGD AI | REDLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
    --red: #d90000; --red-hover: #b30000; --bg: #ffffff;
    --chat-bg: #f8f9fa; --text: #1a1a1a; --text-light: #666666;
    --border: #e5e5e5; --sidebar-w: 280px;
}
body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

/* CABEÇALHO FIXO */
header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.menu-btn { position: absolute; left: 15px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 5px; }
.menu-btn span { display: block; width: 25px; height: 3px; background-color: var(--red); border-radius: 3px; }
.header-title { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 1px; }

/* SIDEBAR */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1001; }
.overlay.open { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; left: -var(--sidebar-w); bottom: 0; width: var(--sidebar-w); background: var(--bg); border-right: 1px solid var(--border); z-index: 1002; transition: transform 0.3s ease; display: flex; flex-direction: column; padding: 15px; transform: translateX(-100%); }
.sidebar.open { transform: translateX(0); }
.sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.sidebar-header h2 { font-size: 14px; color: var(--text-light); }
.close-btn { background: none; border: none; font-size: 24px; color: var(--text-light); cursor: pointer; }
.new-chat-btn { background: var(--red); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 15px; width: 100%; }
.history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.history-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text); background: var(--chat-bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; }
.history-item:hover, .history-item.active { background: #fff0f0; border-color: #ffcccc; }

/* EXPORTAR / IMPORTAR */
.data-actions { display: flex; gap: 5px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
.data-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; cursor: pointer; font-weight: 600; text-align: center; }
.data-btn:hover { background: var(--chat-bg); }

/* AREA DE CHAT */
.chat-container { flex: 1; overflow-y: auto; padding: 80px 15px 100px 15px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

/* MENSAGENS */
.msg-row { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; }
.msg-row.user { align-items: flex-end; }
.msg-row.ai { align-items: flex-start; }
.msg-image { max-width: 80%; max-height: 250px; border-radius: 16px; margin-bottom: 8px; object-fit: cover; }
.bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
.msg-row.user .bubble { background: var(--red); color: white; border-bottom-right-radius: 4px; }
.msg-row.ai .bubble { background: var(--chat-bg); color: var(--text); border-bottom-left-radius: 4px; }

/* CORE LIVE */
.core-live { font-size: 13px; color: #888; font-style: italic; padding: 5px 0; display: flex; flex-direction: column; gap: 4px; }
.core-live-step::before { content: '• '; color: var(--red); }
.processing-time { font-size: 12px; color: #888; margin-bottom: 8px; padding-left: 5px; display: flex; align-items: center; gap: 5px; }
.processing-time::after { content: '›'; font-size: 16px; color: #ccc; }

/* BOTOES */
.actions { display: flex; gap: 10px; margin-top: 10px; }
.action-btn { background: none; border: 1px solid var(--border); border-radius: 20px; color: var(--text-light); padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.action-btn:hover { background: #eee; }

/* CÓDIGO E TABELAS */
.code-container { background: #1e1e1e; border-radius: 10px; margin: 10px 0; max-width: 100%; overflow: hidden; border: 1px solid #333; }
.code-header { display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 8px 15px; color: #ccc; font-size: 12px; border-bottom: 1px solid #444; }
.copy-btn { background: #444; border: none; color: #fff; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 11px; font-weight: 600; }
.copy-btn:hover { background: #555; }
pre { margin: 0; padding: 0; overflow-x: auto; max-width: 100%; background: #1e1e1e !important; }
code { display: block; padding: 15px; font-family: monospace; font-size: 14px; background: transparent !important; white-space: pre; color: #f8f8f2; }
table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
th { background: #f1f1f1; font-weight: 600; }

/* INPUT AREA */
.input-area { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); z-index: 1000; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; }
#image-preview-container { display: none; padding: 10px 15px 0 15px; }
.image-preview-box { display: inline-flex; position: relative; background: var(--bg); border-radius: 12px; padding: 5px; border: 1px solid var(--border); }
.image-preview-box img { height: 60px; width: 60px; object-fit: cover; border-radius: 8px; }
.cancel-img-btn { position: absolute; top: -8px; right: -8px; background: #333; color: white; border: 2px solid white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.input-row { padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 10px; }
.plus-btn { background: var(--red); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 24px; flex-shrink: 0; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.input-box { flex: 1; background: var(--chat-bg); border-radius: 20px; padding: 10px 15px; display: flex; align-items: center; border: 1px solid var(--border); }
.input-box input[type="text"] { width: 100%; border: none; background: transparent; outline: none; font-size: 15px; font-family: inherit; }
.send-btn { background: var(--red); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; flex-shrink: 0; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.send-btn svg { width: 18px; height: 18px; fill: white; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ERRO DE REDE */
.network-error { position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: rgba(50, 50, 50, 0.85); color: white; backdrop-filter: blur(5px); padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 2000; display: none; text-align: center; width: max-content; max-width: 90%; }
.network-error.show { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<div class="network-error" id="network-error">Mensagem não enviada, por favor verifique a sua ligação.</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>MGD REDLINE</h2>
        <button class="close-btn" onclick="closeSidebar()">×</button>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ Nova Conversa</button>
    <div class="history-list" id="history-list"></div>
    
    <div class="data-actions">
        <button class="data-btn" onclick="exportData()">⬇ Exportar</button>
        <button class="data-btn" onclick="document.getElementById('import-file').click()">⬆ Importar</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
    </div>
</div>

<header>
    <button class="menu-btn" onclick="openSidebar()"><span></span><span></span><span></span></button>
    <div class="header-title">MGD AI</div>
</header>

<div class="chat-container" id="chat-container"></div>

<div class="input-area">
    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    <div id="image-preview-container">
        <div class="image-preview-box">
            <img id="image-preview-img" src="" alt="Preview">
            <button class="cancel-img-btn" onclick="cancelImage()">×</button>
        </div>
    </div>
    <div class="input-row">
        <button class="plus-btn" onclick="document.getElementById('file-input').click()">+</button>
        <div class="input-box">
            <input type="text" id="message-input" placeholder="Message MGD AI..." onkeydown="handleEnter(event)">
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
        </button>
    </div>
</div>

<script>
    const API = 'https://mgd-arena-intelligence.onrender.com';
    let conversations = [];
    let activeChatId = null;
    let currentImageBase64 = null;
    let isProcessing = false;
    let currentAudio = null;
    let serverAwake = false;

    // ==========================================
    // GESTÃO DE DADOS (INDEXEDDB ROBUSTO)
    // ==========================================
    let db;
    const request = indexedDB.open('MGD_AI_DB', 2);

    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('chats')) {
            db.createObjectStore('chats', { keyPath: 'id' });
        }
    };

    request.onsuccess = (e) => {
        db = e.target.result;
        loadConversations();
    };

    request.onerror = (e) => {
        console.error("Erro no IndexedDB:", e);
        alert("O teu navegador bloqueou o armazenamento local. O histórico pode não ser guardado.");
    };

    function saveChatToDB(chat) {
        if (!db) return;
        const tx = db.transaction('chats', 'readwrite');
        tx.objectStore('chats').put(chat);
    }

    function loadConversations() {
        if (!db) return;
        const tx = db.transaction('chats', 'readonly');
        const req = tx.objectStore('chats').getAll();
        
        req.onsuccess = () => {
            if (req.result && req.result.length > 0) {
                conversations = req.result.sort((a, b) => b.id.localeCompare(a.id));
                
                const savedActiveId = localStorage.getItem('mgd_active_chat');
                const chatToLoad = conversations.find(c => c.id === savedActiveId) || conversations[0];
                
                loadChat(chatToLoad.id);
            } else {
                createNewChat();
            }
        };
    }

    // ==========================================
    // EXPORTAR / IMPORTAR
    // ==========================================
    function exportData() {
        if (conversations.length === 0) return alert("Não há conversas para exportar.");
        const dataStr = JSON.stringify({ app: "MGD AI", format_version: 1, conversations: conversations }, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `MGD_AI_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (data.app !== "MGD AI" || !Array.isArray(data.conversations)) throw new Error("Inválido");
                
                const existingIds = conversations.map(c => c.id);
                let importedCount = 0;
                
                data.conversations.forEach(chat => {
                    if (!existingIds.includes(chat.id)) {
                        conversations.push(chat);
                        saveChatToDB(chat);
                        importedCount++;
                    }
                });
                
                renderSidebar();
                alert(`Importação concluída! ${importedCount} conversas adicionadas.`);
            } catch (err) {
                alert("Erro: O ficheiro não é um backup válido do MGD AI.");
            }
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    // ==========================================
    // LÓGICA DO CHAT
    // ==========================================
    window.onload = async () => {
        try {
            const res = await fetch(`${API}/health`, { method: 'GET' });
            if (res.ok) serverAwake = true;
        } catch(e) { serverAwake = false; }
    };

    function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

    function createNewChat() {
        const newChat = { id: 'chat_' + Date.now(), title: 'Nova Conversa', history: [] };
        conversations.unshift(newChat);
        saveChatToDB(newChat);
        activeChatId = newChat.id;
        localStorage.setItem('mgd_active_chat', activeChatId);
        
        renderSidebar();
        document.getElementById('chat-container').innerHTML = '';
        closeSidebar();
    }

    function startNewChat() { createNewChat(); }

    function loadChat(id) {
        activeChatId = id;
        localStorage.setItem('mgd_active_chat', activeChatId);
        renderSidebar();
        
        const chat = conversations.find(c => c.id === id);
        const container = document.getElementById('chat-container');
        container.innerHTML = '';
        
        if (chat && chat.history && chat.history.length > 0) {
            chat.history.forEach(msg => {
                if (msg.role === 'user') addUserMessageToDOM(msg.content, msg.imageSrc || null);
                else if (msg.role === 'assistant') addAIMessageToDOM(msg.content, msg.timeTaken, msg.sources || []);
            });
        }
        closeSidebar();
    }

    function renderSidebar() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        conversations.forEach(chat => {
            const div = document.createElement('div');
            div.className = `history-item ${chat.id === activeChatId ? 'active' : ''}`;
            div.textContent = chat.title || "Nova Conversa";
            div.onclick = () => loadChat(chat.id);
            list.appendChild(div);
        });
    }

    function handleEnter(e) { 
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage(); 
        }
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > 800 || height > 800) {
                    if (width > height) { height *= 800 / width; width = 800; }
                    else { width *= 800 / height; height = 800; }
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                currentImageBase64 = dataUrl.split(',')[1];
                document.getElementById('image-preview-img').src = dataUrl;
                document.getElementById('image-preview-container').style.display = 'block';
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = ''; 
    }

    function cancelImage() {
        currentImageBase64 = null;
        document.getElementById('image-preview-container').style.display = 'none';
        document.getElementById('image-preview-img').src = '';
    }

    function addUserMessageToDOM(text, imageSrc = null) {
        const container = document.getElementById('chat-container');
        const row = document.createElement('div');
        row.className = 'msg-row user';
        if (imageSrc) {
            const img = document.createElement('img');
            img.src = imageSrc;
            img.className = 'msg-image';
            row.appendChild(img);
        }
        if (text) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            row.appendChild(bubble);
        }
        container.appendChild(row);
        scrollToBottom();
    }

    function addAIMessageToDOM(text, timeTaken = null, sources = []) {
        const container = document.getElementById('chat-container');
        const row = document.createElement('div');
        row.className = 'msg-row ai';

        if (timeTaken) {
            const timeLabel = document.createElement('div');
            timeLabel.className = 'processing-time';
            timeLabel.textContent = `Processou durante ${timeTaken} segundos`;
            row.appendChild(timeLabel);
        }

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatResponse(text);
        row.appendChild(bubble);
        bubble.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));

        if (sources && sources.length > 0) {
            const sourcesDiv = document.createElement('div');
            sourcesDiv.style.marginTop = '10px';
            sourcesDiv.style.fontSize = '12px';
            sourcesDiv.innerHTML = '<strong>Fontes:</strong><br>' + 
                sources.map(s => `<a href="${s.url}" target="_blank" style="color:var(--red); text-decoration:underline;">${s.title}</a>`).join('<br>');
            bubble.appendChild(sourcesDiv);
        }

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';
        const listenBtn = document.createElement('button');
        listenBtn.className = 'action-btn';
        listenBtn.innerHTML = '🔊 Ouvir';
        listenBtn.onclick = () => playAudio(text, listenBtn);
        actionsDiv.appendChild(listenBtn);
        row.appendChild(actionsDiv);

        container.appendChild(row);
        scrollToBottom();
    }

    function sanitizeText(text) { return text.replace(/[*#]/g, ''); }

    function formatResponse(text) {
        let html = sanitizeText(text);
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
            const language = lang || 'plaintext';
            const escapedCode = code.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return `
                <div class="code-container">
                    <div class="code-header">
                        <span>${language.toUpperCase()}</span>
                        <button class="copy-btn" onclick="copyCode(this)">Copiar</button>
                    </div>
                    <pre><code class="language-${language}">${escapedCode}</code></pre>
                </div>
            `;
        });

        const lines = html.split('\n');
        let inTable = false;
        let tableHtml = '';
        let processedHtml = [];

        lines.forEach(line => {
            if (line.includes('|') && line.split('|').length > 2) {
                if (!inTable) { inTable = true; tableHtml = '<table>'; }
                if (!line.includes('---')) {
                    const cells = line.split('|').filter(c => c.trim() !== '');
                    tableHtml += '<tr>';
                    cells.forEach(cell => tableHtml += `<td>${cell.trim()}</td>`);
                    tableHtml += '</tr>';
                }
            } else {
                if (inTable) { tableHtml += '</table>'; processedHtml.push(tableHtml); inTable = false; }
                processedHtml.push(line);
            }
        });
        if (inTable) { tableHtml += '</table>'; processedHtml.push(tableHtml); }

        return processedHtml.join('<br>').replace(/<br><table>/g, '<table>').replace(/<\/table><br>/g, '</table>');
    }

    function copyCode(btn) {
        const codeEl = btn.closest('.code-container').querySelector('code');
        const textToCopy = codeEl.innerText;

        function showSuccess() {
            btn.textContent = 'Copiado!';
            setTimeout(() => btn.textContent = 'Copiar', 2000);
        }

        function fallbackCopy() {
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showSuccess();
            } catch (err) {
                alert('Falha ao copiar. O teu navegador bloqueou a ação.');
            }
            document.body.removeChild(textArea);
        }

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(showSuccess).catch(fallbackCopy);
        } else {
            fallbackCopy();
        }
    }

    async function sendMessage() {
        if (isProcessing) return;
        
        const input = document.getElementById('message-input');
        let text = input.value.trim();
        if (!text && !currentImageBase64) return;

        const imgToSend = currentImageBase64;
        const dataUrlToSave = imgToSend ? "data:image/jpeg;base64," + imgToSend : null;
        
        let textToSend = text;
        if (!textToSend && imgToSend) textToSend = "O que há nesta imagem?";

        addUserMessageToDOM(text, dataUrlToSave);
        
        input.value = '';
        cancelImage(); 
        isProcessing = true;
        const sendBtn = document.getElementById('send-btn');
        sendBtn.disabled = true;
        
        const container = document.getElementById('chat-container');
        const aiRow = document.createElement('div');
        aiRow.className = 'msg-row ai';
        
        const coreLive = document.createElement('div');
        coreLive.className = 'core-live';
        
        if (!serverAwake) {
            coreLive.innerHTML = '<div class="core-live-step">A Ligar o Servidor MGD...</div>';
        } else {
            coreLive.innerHTML = '<div class="core-live-step">A processar pedido...</div>';
        }
        aiRow.appendChild(coreLive);
        container.appendChild(aiRow);
        scrollToBottom();

        const startTime = Date.now();
        
        try {
            let chat = conversations.find(c => c.id === activeChatId);
            
            if (!chat) {
                chat = { id: 'chat_' + Date.now(), title: 'Nova Conversa', history: [] };
                conversations.unshift(chat);
                activeChatId = chat.id;
                localStorage.setItem('mgd_active_chat', activeChatId);
            }

            if (chat.history.length === 0) {
                chat.title = text ? (text.substring(0, 25) + (text.length > 25 ? '...' : '')) : "Análise de Imagem";
                renderSidebar();
            }

            const historyForBackend = chat.history.map(msg => ({
                role: msg.role,
                content: msg.content
            }));

            const response = await fetch(`${API}/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({
                    message: textToSend,
                    image: imgToSend,
                    history: historyForBackend
                })
            });

            if (!response.ok) {
                let errorMsg = `Erro no servidor (${response.status}).`;
                try {
                    const errorData = await response.json();
                    if (errorData.error || errorData.reply) errorMsg = errorData.error || errorData.reply;
                } catch(e) {}
                if (response.status === 429) errorMsg = "Estás a enviar mensagens muito rápido. Aguarda um minuto.";
                throw new Error(errorMsg);
            }

            if (!response.body) throw new Error('O navegador não suporta a transmissão em tempo real.');

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let data = null;

            function processSSEBlock(block) {
                let eventName = 'message';
                let payload = '';
                block.split(/\r?\n/).forEach(line => {
                    if (line.startsWith('event:')) eventName = line.slice(6).trim();
                    else if (line.startsWith('data:')) payload += line.slice(5).trim();
                });
                if (!payload) return;
                let parsed;
                try { parsed = JSON.parse(payload); } catch(e) { return; }

                if (eventName === 'activity') {
                    const step = document.createElement('div');
                    step.className = 'core-live-step';
                    step.textContent = parsed.message || 'A processar...';
                    coreLive.appendChild(step);
                    scrollToBottom();
                } else if (eventName === 'done') {
                    data = parsed;
                } else if (eventName === 'error') {
                    throw new Error(parsed.message || 'Ocorreu um erro durante o processamento.');
                }
            }

            while (true) {
                const { value, done: streamDone } = await reader.read();
                if (streamDone) break;
                buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, '\n');
                const blocks = buffer.split('\n\n');
                buffer = blocks.pop() || '';
                blocks.forEach(processSSEBlock);
            }
            buffer += decoder.decode();
            if (buffer.trim()) processSSEBlock(buffer);
            if (!data) throw new Error('A ligação terminou antes de a resposta ficar concluída.');

            serverAwake = true;
            const endTime = Date.now();
            const seconds = ((endTime - startTime) / 1000).toFixed(1);
            if (aiRow.contains(coreLive)) aiRow.removeChild(coreLive);
            
            const timeLabel = document.createElement('div');
            timeLabel.className = 'processing-time';
            timeLabel.textContent = `Processou durante ${seconds} segundos`;
            aiRow.appendChild(timeLabel);
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = formatResponse(data.reply);
            aiRow.appendChild(bubble);
            
            bubble.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
            
            if (data.sources && data.sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.style.marginTop = '10px';
                sourcesDiv.style.fontSize = '12px';
                sourcesDiv.innerHTML = '<strong>Fontes:</strong><br>' + 
                    data.sources.map(s => `<a href="${s.url}" target="_blank" style="color:var(--red); text-decoration:underline;">${s.title}</a>`).join('<br>');
                bubble.appendChild(sourcesDiv);
            }

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'actions';
            const listenBtn = document.createElement('button');
            listenBtn.className = 'action-btn';
            listenBtn.innerHTML = '🔊 Ouvir';
            listenBtn.onclick = () => playAudio(data.reply, listenBtn);
            actionsDiv.appendChild(listenBtn);
            aiRow.appendChild(actionsDiv);

            chat.history.push({ role: 'user', content: textToSend, imageSrc: dataUrlToSave });
            chat.history.push({ role: 'assistant', content: data.reply, timeTaken: seconds, sources: data.sources });
            saveChatToDB(chat);

            document.getElementById('network-error').classList.remove('show');

        } catch (error) {
            if (aiRow.contains(coreLive)) aiRow.removeChild(coreLive);
            const errBubble = document.createElement('div');
            errBubble.className = 'bubble';
            errBubble.style.color = 'var(--red)';
            errBubble.style.background = '#ffebee';
            
            if (error.message.includes("Failed to fetch") || error.name === "TypeError") {
                errBubble.textContent = "Falha de rede. Verifica a tua ligação à internet.";
                document.getElementById('network-error').classList.add('show');
            } else {
                errBubble.textContent = error.message;
            }
            
            aiRow.appendChild(errBubble);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            scrollToBottom();
        }
    }

    async function playAudio(text, btn) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio = null;
            btn.innerHTML = '🔊 Ouvir';
            return;
        }
        btn.innerHTML = 'A gerar...';
        btn.disabled = true;
        try {
            const res = await fetch(`${API}/tts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            if (!res.ok) throw new Error("Erro TTS");
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            currentAudio = new Audio(url);
            btn.innerHTML = '⏹ Parar';
            btn.disabled = false;
            currentAudio.onended = () => {
                btn.innerHTML = '🔊 Ouvir';
                currentAudio = null;
            };
            currentAudio.play();
        } catch (e) {
            btn.innerHTML = '🔊 Ouvir';
            btn.disabled = false;
            alert("Erro ao gerar áudio.");
        }
    }

    function scrollToBottom() {
        const container = document.getElementById('chat-container');
        container.scrollTop = container.scrollHeight;
    }
</script>

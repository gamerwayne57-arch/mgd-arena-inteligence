<!DOCTYPE html>
<html lang="mul">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080c16">

<title>MGD ARENA — AI Intelligence</title>

<style>
:root {
  color-scheme: dark;
  --bg: #080c16;
  --panel: #111c2d;
  --line: #293950;
  --txt: #edf4ff;
  --muted: #9aabc2;
  --blue: #35a7ff;
  --cyan: #56e0e8;
  --green: #36d399;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% -20%, #16304c, transparent 55%), var(--bg);
  color: var(--txt);
  font: 15px/1.5 system-ui, Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 18px;
}

.app {
  width: min(900px, 100%);
  min-height: calc(100vh - 36px);
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  background: #0c121ff5;
  box-shadow: 0 20px 60px #0008;
}

header {
  padding: 20px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(110deg, #101e32, #101827);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--blue), #725cff);
  font-size: 24px;
  font-weight: 900;
}

h1 {
  font-size: 19px;
  margin: 0;
}

.sub {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

.status {
  margin-top: 13px;
  color: var(--muted);
  font-size: 12px;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #64748b;
  margin-right: 7px;
}

.dot.ok {
  background: var(--green);
}

#chat {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: auto;
  min-height: 340px;
}

.msg {
  max-width: 94%;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.assistant {
  align-self: flex-start;
  background: #121d2e;
}

.user {
  align-self: flex-end;
  background: #12304b;
  border-color: #24557d;
}

.label {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--cyan);
  font-weight: 800;
  margin-bottom: 6px;
}

.user .label {
  color: #9dccff;
}

a {
  color: #72c7ff;
  overflow-wrap: anywhere;
  text-decoration: underline;
}

a:hover {
  color: var(--cyan);
}

.sources {
  margin-top: 12px;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 13px;
}

.sources strong {
  display: block;
  color: var(--cyan);
}

.sources a {
  display: block;
  margin-top: 5px;
}

.notice {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 8px;
}

form {
  padding: 14px;
  border-top: 1px solid var(--line);
  background: #0b1220;
}

.controls {
  display: flex;
  gap: 9px;
}

textarea {
  flex: 1;
  min-height: 52px;
  max-height: 150px;
  resize: vertical;
  background: var(--panel);
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 12px;
  font: inherit;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 0 19px;
  background: linear-gradient(135deg, var(--blue), #536dff);
  color: white;
  font-weight: 800;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  color: var(--muted);
  font-size: 11px;
}

.clear {
  background: transparent;
  border: 1px solid var(--line);
  padding: 6px 10px;
  color: var(--muted);
}

@media(max-width:560px) {
  body {
    padding: 0;
  }

  .app {
    min-height: 100vh;
    border: 0;
    border-radius: 0;
  }

  .controls {
    flex-direction: column;
  }

  button {
    height: 44px;
  }

  .msg {
    max-width: 100%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">M</div>

    <div>
      <h1>MGD ARENA AI</h1>
      <div class="sub">INTELLIGENCE · GROQ + WEB SEARCH</div>
    </div>
  </div>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="status">A verificar backend…</span>
  </div>
</header>

<main id="chat" aria-live="polite">

  <div class="msg assistant">
    <div class="label">MGD AI</div>
    Salve, gamer! 🎮🔥
    Faz uma pergunta sobre jogos, disponibilidade, requisitos ou atualizações.
    Estou pronta para entrar em ação!
  </div>

</main>

<div class="notice">
  MGD ARENA AI · INTELLIGENCE SYSTEM
</div>

<form id="form">

  <div class="controls">

    <textarea
      id="message"
      maxlength="6000"
      placeholder="Escreve a tua pergunta..."
      required
    ></textarea>

    <button id="send">ENVIAR ➤</button>

  </div>

  <div class="bottom">

    <span>Enter para enviar · Shift + Enter para nova linha</span>

    <button class="clear" id="clear" type="button">
      Limpar conversa
    </button>

  </div>

</form>

</div>

<script>
(() => {

  const API = "https://mgd-arena-intelligence.onrender.com";

  const chat = document.querySelector("#chat");
  const form = document.querySelector("#form");
  const input = document.querySelector("#message");
  const send = document.querySelector("#send");

  const history = [];

  // Remove asteriscos das respostas da IA.
  function cleanText(text) {
    return String(text).split("*").join("");
  }

  // Converte URLs e links Markdown em links clicáveis.
  function renderMessage(text) {

    const body = document.createElement("div");

    text = cleanText(text);

    const pattern =
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"']+)/g;

    let lastIndex = 0;
    let match;

    while ((match = pattern.exec(text)) !== null) {

      body.appendChild(
        document.createTextNode(
          text.slice(lastIndex, match.index)
        )
      );

      const label = match[1] || match[3];

      let rawUrl = match[2] || match[3];

      let trailing = "";

      if (!match[2]) {

        while (/[.,!?;:]$/.test(rawUrl)) {

          trailing = rawUrl.slice(-1) + trailing;

          rawUrl = rawUrl.slice(0, -1);
        }
      }

      try {

        const url = new URL(rawUrl);

        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error("URL inválida");
        }

        const link = document.createElement("a");

        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = label;

        body.appendChild(link);

        if (trailing) {
          body.appendChild(
            document.createTextNode(trailing)
          );
        }

      } catch (error) {

        body.appendChild(
          document.createTextNode(match[0])
        );

      }

      lastIndex = pattern.lastIndex;
    }

    body.appendChild(
      document.createTextNode(text.slice(lastIndex))
    );

    return body;
  }

  // Adiciona mensagens.
  function add(role, text, sources = []) {

    const box = document.createElement("div");

    box.className =
      "msg " + (role === "user" ? "user" : "assistant");

    const label = document.createElement("div");

    label.className = "label";

    label.textContent =
      role === "user" ? "TU" : "MGD AI";

    const body = role === "user"
      ? document.createElement("div")
      : renderMessage(text);

    if (role === "user") {
      body.textContent = text;
    }

    box.append(label, body);

    // Fontes da pesquisa.
    if (sources.length) {

      const area = document.createElement("div");

      area.className = "sources";

      const title = document.createElement("strong");

      title.textContent = "FONTES CONSULTADAS";

      area.append(title);

      sources.forEach((source, index) => {

        try {

          const url = new URL(source.url);

          if (!["http:", "https:"].includes(url.protocol)) {
            return;
          }

          const link = document.createElement("a");

          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          link.textContent =
            `[${index + 1}] ${source.title || url.hostname}`;

          area.append(link);

        } catch (error) {}

      });

      box.append(area);
    }

    chat.append(box);

    chat.scrollTop = chat.scrollHeight;
  }

  // Verifica o backend.
  async function health() {

    try {

      const response = await fetch(API + "/health");

      if (!response.ok) {
        throw new Error();
      }

      const data = await response.json();

      document.querySelector("#dot")
        .classList.toggle("ok", data.status === "ok");

      document.querySelector("#status").textContent =
        `Backend ${data.status} · Groq ${
          data.groq_configured ? "OK" : "pendente"
        } · Web ${
          data.web_search_configured ? "OK" : "pendente"
        }`;

    } catch (error) {

      document.querySelector("#status").textContent =
        "Backend indisponível no momento.";

    }
  }

  // Envio de mensagens.
  form.addEventListener("submit", async event => {

    event.preventDefault();

    const message = input.value.trim();

    if (!message || send.disabled) {
      return;
    }

    add("user", message);

    history.push({
      role: "user",
      content: message
    });

    input.value = "";

    send.disabled = true;

    send.textContent = "A PENSAR…";

    const wait = document.createElement("div");

    wait.className = "msg assistant";

    wait.textContent =
      "A MGD AI está a analisar a pergunta… 🧠";

    chat.append(wait);

    try {

      const response = await fetch(API + "/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          message,

          history: history.slice(0, -1)

        })

      });

      const data = await response.json().catch(() => ({}));

      wait.remove();

      if (!response.ok) {

        throw new Error(
          data.error || "Erro HTTP " + response.status
        );

      }

      const reply = cleanText(
        typeof data.reply === "string"
          ? data.reply
          : "Resposta inválida do backend."
      );

      history.push({
        role: "assistant",
        content: reply
      });

      add(
        "assistant",
        reply,
        Array.isArray(data.sources) ? data.sources : []
      );

      if (data.searched) {

        const notice = document.createElement("div");

        notice.className = "notice";

        notice.textContent =
          "🌐 Esta resposta utilizou resultados da pesquisa Web.";

        chat.append(notice);
      }

    } catch (error) {

      wait.remove();

      add(
        "assistant",
        "Não consegui concluir o pedido: " + error.message
      );

    } finally {

      send.disabled = false;

      send.textContent = "ENVIAR ➤";

      input.focus();

    }

  });

  // Enter envia a mensagem.
  input.addEventListener("keydown", event => {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      form.requestSubmit();

    }

  });

  // Limpar conversa.
  document.querySelector("#clear")
    .addEventListener("click", () => {

      history.length = 0;

      chat.innerHTML = "";

      add(
        "assistant",
        "Conversa limpa! 🎮 Faz a tua próxima pergunta."
      );

    });

  health();

})();
</script>

</body>
</html>
